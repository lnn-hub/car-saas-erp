# Мэдээллийн сангийн долоо хоног тутмын нөөц хуулбар (шифрлэгдсэн).
# Репо нийтэд нээлттэй тул файлыг заавал шифрлэж хадгална. Сэргээх заавар: docs/backup.md
#
# GitHub → Settings → Secrets and variables → Actions дээр 2 secret нэмнэ:
#   DATABASE_URL       — Neon-ий холболтын хаяг (postgresql://...)
#   BACKUP_PASSPHRASE  — нөөцийг шифрлэх урт нууц үг (өөртөө найдвартай хадгална)
name: DB backup

on:
  schedule:
    - cron: "0 18 * * 0" # Даваа гараг бүр 02:00 (Улаанбаатар)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Secrets шалгах
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::DATABASE_URL болон BACKUP_PASSPHRASE secret-уудыг тохируулна уу (docs/backup.md)"
            exit 1
          fi

      - name: PostgreSQL 17 client суулгах
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Нөөцлөх, шахах, шифрлэх
        run: |
          set -euo pipefail
          FILE="car-saas-$(date -u +%Y-%m-%d).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$FILE"
          test -s "$FILE"
          ls -lh "$FILE"

      - name: Хадгалах (90 хоног)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: "*.sql.gz.gpg"
          retention-days: 90
          if-no-files-found: error
