# Push болон pull request бүрт кодыг автоматаар шалгана: формат, lint, төрөл, build.
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  format:
    name: Формат (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Backend холбогдохгүй үед ч build амжилттай болох ёстой (өгөгдлийг хөтөч дээр татна)
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001

  backend:
    name: Backend (modules, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: car_saas_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/car_saas_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      # Хоосон сан дээр бүх migration ажиллах ёстой, хоёр дахь удаа юу ч хийхгүй байх ёстой
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run create-admin -- ci@example.mn ci-password-123
